<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>
        {% block title %}Python Quiz{% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand" href="/">
                Python Quiz
            </a>

            <div>

                <a class="btn btn-outline-light me-2" href="/">
                    Home
                </a>

                {% if session.get("user_id") %}

                    <a class="btn btn-outline-light me-2" href="/quiz">
                        Quiz
                    </a>

                    <a class="btn btn-outline-light me-2" href="/ranking">
                        Ranking
                    </a>

                    <a class="btn btn-danger" href="/logout">
                        Logout
                    </a>

                {% else %}

                    <a class="btn btn-outline-light me-2" href="/register">
                        Register
                    </a>

                    <a class="btn btn-success" href="/login">
                        Login
                    </a>

                {% endif %}

            </div>

        </div>

    </nav>


    <div class="container mt-4">

        {% block content %}
        {% endblock %}

    </div>


    <footer class="text-center mt-5 mb-3">

        <hr>

        <p>
            Developed by SOROOSH NAZEM
        </p>

    </footer>

</body>
