<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
            SOPRO
        {% endblock %}
    </title>


    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =====================================================
         CUSTOM CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <nav
        class="
            navbar
            navbar-expand-lg
            navbar-dark
            bg-dark
            shadow-sm
        "
    >

        <div class="container">


            <!-- BRAND -->

            <a
                class="navbar-brand fw-bold"
                href="/"
            >
                SOPRO
            </a>


            <!-- MOBILE BUTTON -->

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- NAVBAR CONTENT -->

            <div
                class="collapse navbar-collapse"
                id="mainNavbar"
            >

                <div
                    class="
                        navbar-nav
                        ms-auto
                        align-items-lg-center
                        gap-lg-2
                        mt-3
                        mt-lg-0
                    "
                >


                    <!-- HOME -->

                    <a
                        class="nav-link"
                        href="/"
                    >
                        Home
                    </a>

                     <!-- LESSONS -->

                    <a
                        class="nav-link"
                        href="/lessons"
                    >
                        Lessons
                    </a>


                    {% if session.get("user_id") %}


                        <!-- QUIZ -->

                        <a
                            class="nav-link"
                            href="/quiz"
                        >
                            Quiz
                        </a>


                        <!-- RANKING -->

                        <a
                            class="nav-link"
                            href="/ranking"
                        >
                            Ranking
                        </a>


                        <!-- ADMIN -->

                        {% if session.get("role") == "admin" %}

                            <a
                                class="
                                    btn
                                    btn-warning
                                    btn-sm
                                    px-3
                                    my-2
                                    my-lg-0
                                "
                                href="/admin"
                            >
                                Admin
                            </a>

                        {% endif %}


                        <!-- LOGOUT -->

                        <a
                            class="
                                btn
                                btn-outline-light
                                btn-sm
                                px-3
                                my-2
                                my-lg-0
                            "
                            href="/logout"
                        >
                            Logout
                        </a>


                    {% else %}


                        <!-- REGISTER -->

                        <a
                            class="nav-link"
                            href="/register"
                        >
                            Register
                        </a>


                        <!-- LOGIN -->

                        <a
                            class="
                                btn
                                btn-primary
                                btn-sm
                                px-3
                                my-2
                                my-lg-0
                            "
                            href="/login"
                        >
                            Login
                        </a>


                    {% endif %}

                </div>

            </div>

        </div>

    </nav>


    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main>

        <div class="container">

            {% block content %}
            {% endblock %}

        </div>

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="site-footer mt-5">

        <div class="container">

            <div
                class="
                    d-flex
                    flex-column
                    flex-md-row
                    justify-content-between
                    align-items-center
                    gap-2
                    py-4
                "
            >

                <div class="text-muted small">

                    SOPRO · Python Learning Platform

                </div>


                <div class="text-muted small">

                    Developed by
                    <strong>SOROOSH NAZEM</strong>

                </div>

            </div>

        </div>

    </footer>


    <!-- =====================================================
         BOOTSTRAP JAVASCRIPT
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


</body>

</html>
