{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<h1>Login</h1>

{% if message %}
    <p>{{ message }}</p>
{% endif %}

<form method="POST">

    <label>Username:</label>
    <input type="text" name="username">

    <br><br>

    <label>Password:</label>
    <input type="password" name="password">

    <br><br>

    <button type="submit">Login</button>

</form>

{% endblock %}
