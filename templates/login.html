{% extends "base.html" %}

{% block title %}
Login - SOPRO
{% endblock %}


{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-5">

            <!-- =====================================================
                 HEADER
            ====================================================== -->

            <div class="text-center mb-4">

                <div class="auth-icon mb-3">
                    👋
                </div>

                <h1 class="fw-bold mb-2">
                    Welcome back
                </h1>

                <p class="text-muted">
                    Accedi per continuare il tuo
                    percorso di apprendimento.
                </p>

            </div>


            <!-- =====================================================
                 LOGIN CARD
            ====================================================== -->

            <div
                class="
                    auth-card
                    card
                    border-0
                    shadow-sm
                    rounded-4
                "
            >

                <div class="card-body p-4 p-md-5">


                    <!-- MESSAGE -->

                    {% if message %}

                        <div
                            class="
                                alert
                                alert-danger
                                rounded-3
                                mb-4
                            "
                        >
                            {{ message }}
                        </div>

                    {% endif %}


                    <!-- LOGIN FORM -->

                    <form method="POST">

                        <!-- USERNAME -->

                        <div class="mb-4">

                            <label
                                for="username"
                                class="form-label fw-semibold"
                            >
                                Username
                            </label>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                class="form-control form-control-lg"
                                placeholder="Inserisci il tuo username"
                                autocomplete="username"
                                required
                            >

                        </div>


                        <!-- PASSWORD -->

                        <div class="mb-4">

                            <label
                                for="password"
                                class="form-label fw-semibold"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control form-control-lg"
                                placeholder="Inserisci la tua password"
                                autocomplete="current-password"
                                required
                            >

                        </div>


                        <!-- LOGIN BUTTON -->

                        <button
                            type="submit"
                            class="btn btn-primary btn-lg w-100"
                        >
                            Login →
                        </button>

                    </form>


                    <!-- REGISTER LINK -->

                    <div class="text-center mt-4">

                        <span class="text-muted">
                            Non hai ancora un account?
                        </span>

                        <a
                            href="/register"
                            class="text-decoration-none fw-semibold"
                        >
                            Registrati
                        </a>

                    </div>

                </div>

            </div>


            <!-- BACK HOME -->

            <div class="text-center mt-4">

                <a
                    href="/"
                    class="text-decoration-none text-muted"
                >
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
