{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h1 class="mb-3">
        Python Quiz
    </h1>

    <p class="mb-4">
        Scegli il topic su cui vuoi esercitarti.
    </p>

    <div class="row">

        {% for topic in topics %}

            <div class="col-md-4 mb-3">

                <div class="card h-100">

                    <div class="card-body">

                        <h5 class="card-title">
                            {{ topic[1] }}
                        </h5>

                        <a
                            href="/quiz/difficulty?topic={{ topic[0] }}"
                            class="btn btn-primary"
                        >
                            Inizia Quiz
                        </a>

                    </div>

                </div>

            </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
