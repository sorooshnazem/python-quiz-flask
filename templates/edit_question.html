{% extends "base.html" %}

{% block title %}
Modifica domanda
{% endblock %}

{% block content %}

<h1>Modifica domanda</h1>

<form method="POST">

    <div class="mb-3">
        <label class="form-label">Domanda</label>

        <input
            type="text"
            class="form-control"
            name="question"
            value="{{ question[1] }}"
            required
        >
    </div>


    <div class="mb-3">
        <label class="form-label">Opzione 1</label>

        <input
            type="text"
            class="form-control"
            name="option1"
            value="{{ question[2] }}"
            required
        >
    </div>


    <div class="mb-3">
        <label class="form-label">Opzione 2</label>

        <input
            type="text"
            class="form-control"
            name="option2"
            value="{{ question[3] }}"
            required
        >
    </div>


    <div class="mb-3">
        <label class="form-label">Opzione 3</label>

        <input
            type="text"
            class="form-control"
            name="option3"
            value="{{ question[4] }}"
            required
        >
    </div>


    <div class="mb-3">
        <label class="form-label">Opzione 4</label>

        <input
            type="text"
            class="form-control"
            name="option4"
            value="{{ question[5] }}"
            required
        >
    </div>


    <div class="mb-3">

        <label class="form-label">
            Risposta corretta
        </label>

        <select
            class="form-select"
            name="correct_answer"
            required
        >

            <option
                value="1"
                {% if question[6] == question[2] %}selected{% endif %}
            >
                Opzione 1
            </option>

            <option
                value="2"
                {% if question[6] == question[3] %}selected{% endif %}
            >
                Opzione 2
            </option>

            <option
                value="3"
                {% if question[6] == question[4] %}selected{% endif %}
            >
                Opzione 3
            </option>

            <option
                value="4"
                {% if question[6] == question[5] %}selected{% endif %}
            >
                Opzione 4
            </option>

        </select>

    </div>


    <button
        type="submit"
        class="btn btn-success"
    >
        Salva modifiche
    </button>

    <a
        href="/admin"
        class="btn btn-secondary"
    >
        Annulla
    </a>

</form>

{% endblock %}
