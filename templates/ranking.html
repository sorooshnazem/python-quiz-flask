{% extends "base.html" %}

{% block title %}
Ranking
{% endblock %}

{% block content %}

<h1>Ranking</h1>

<table border="1">

    <tr>
        <th>Nickname</th>
        <th>Score</th>
    </tr>

    {% for user in users %}

        <tr>
            <td>{{ user[0] }}</td>
            <td>{{ user[1] }}</td>
        </tr>

    {% endfor %}

</table>

{% endblock %}
